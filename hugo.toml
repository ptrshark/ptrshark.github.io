baseURL = "https://shark-asmx.github.io/"
title = "shark-asmx"
theme = "rusty-typewriter"
enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = [ "posts" ]
pagination.pagerSize = 20

# disableKinds = ["sitemap", "robotsTXT"]


[minify]
disableXML = true

[languages.en]
languageName = "English"
weight = 1

[languages.en.taxonomies]
category = "categories"
tag = "tags"
series = "series"


  # [languages.en.params]
  # languageAltTitle = "English"
  #   [languages.en.params.logo]
  #   logoText = "shark.exe [0]"
  #   logoHomeLink = "/posts"

    [languages.en.params.profileMode]
    enabled = true
    title = "shark-asmx"
    imageUrl = "https://avatars.githubusercontent.com/u/89577007"
    imageTitle = "Profile image"
    imageWidth = 130
    imageHeight = 130
    subtitle = " ~/"

      [[languages.en.params.profileMode.buttons]]
      name = "Blog"
      url = "posts"

[params]
env = "production"
mainpagetitle = "hex codes"
mainpagesubtitle = "shark blog"
copyrightname = "shark-asmx"
loadspeedfactor = 10.0
description = "shark-asmx's blog"
defaultTheme = "auto"
ShowShareButtons = true
ShowReadingTime = true
displayFullLangName = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true
theme = "dark"
palette = "rusty-typewriter"
showThemeNotice = true
showPostsSummary = true
contentTypeName = "posts"
themeColor = "orange"
fullWidthTheme = false

  [params.profileMode]
  enabled = false
  title = "shark-asmx"
  imageUrl = "#"
  imageTitle = "my image"

    [[params.profileMode.buttons]]
    name = "Tags"
    url = "tags"

  [params.homeInfoParams]
  Title = "Hii, I'm shark!!. I go with prefix shark"
  Content = [
      "i'm curious about everything and can read pretty much anything. doesn’t mean my brain actually processes any of it, though"
]

  [[params.socialIcons]]
  name = "Github"
  title = "Join me on Github"
  url = "https://github.com/shark-asmx"

  [[params.socialIcons]]
  name = "X"
  title = "Join me on Twitter"
  url = "https://twitter.com/shark-asmx"

  [[params.socialIcons]]
  name = "linkedin"
  title = "Join me on LinkedIn"
  url = "https://www.linkedin.com/in/sabhya05/"


  [params.assets]
  disableHLJS = true

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[services.instagram]
disableInlineCSS = true

[services.x]
disableInlineCSS = true



[menu]
  [[menu.main]]
    identifier = "posts"
    name = "All posts"
    url = "/posts/"       # The path can lead to a content folder too.
    weight = 20

